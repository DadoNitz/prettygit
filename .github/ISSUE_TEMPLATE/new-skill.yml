name: New skill
description: Propose a focused agent workflow.
title: "[Skill] "
body:
  - type: input
    id: name
    attributes:
      label: Skill name
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case and example prompt
      description: What outcome is missing from the existing skills?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and verification
      description: Inputs, outputs, CLI commands, private data, remote edits needing confirmation, and how to check success.
    validations:
      required: true
