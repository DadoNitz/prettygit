name: polish-bot
# Weekly: pick one repo from bot/targets.json, polish its front-end with Claude Code, open a DRAFT PR.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`) or ANTHROPIC_API_KEY,
#          BOT_GH_TOKEN (fine-grained PAT: contents + pull requests write on the target repos).
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'owner/repo from bot/targets.json (empty = next in rotation)'
        required: false
      dry_run:
        description: 'Commit locally only, no PR'
        type: boolean
        default: false
permissions:
  contents: read
concurrency: polish-bot
jobs:
  polish:
    if: github.repository_owner == 'DadoNitz' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - run: |
          git config --global user.name "prettygit-bot"
          git config --global user.email "prettygit-bot@users.noreply.github.com"
      - name: Polish
        env:
          GH_TOKEN: ${{ secrets.BOT_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ inputs.repo }}
        run: node bot/run.mjs $REPO ${{ inputs.dry_run && '--dry-run' || '' }}
